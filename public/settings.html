<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings | Velvet Junction</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        /* Settings Page Specific Styles */
        .settings-wrapper {
            min-height: 100vh;
            background: radial-gradient(circle at top right, #1e113a, #0b0614);
            padding: 40px;
        }
        
        .settings-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .settings-header {
            margin-bottom: 40px;
            text-align: center;
        }
        
        .settings-header h1 {
            font-size: 2.5rem;
            background: linear-gradient(to right, #ffffff, var(--purple-soft));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        
        .settings-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .settings-card {
            background: var(--glass);
            backdrop-filter: blur(14px);
            border-radius: 24px;
            border: 1px solid rgba(124, 58, 237, 0.25);
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .settings-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(124, 58, 237, 0.2);
            border-color: var(--purple-main);
        }
        
        .card-header {
            padding: 24px 28px;
            border-bottom: 1px solid rgba(124, 58, 237, 0.2);
            background: linear-gradient(135deg, rgba(124, 58, 237, 0.1), rgba(0, 0, 0, 0.2));
        }
        
        .card-header h3 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--purple-soft);
            margin-bottom: 6px;
        }
        
        .card-header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.8;
        }
        
        .card-body {
            padding: 28px;
        }
        
        /* Form Elements */
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .settings-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }
        
        .settings-input:focus {
            outline: none;
            border-color: var(--purple-main);
            box-shadow: 0 0 8px var(--purple-glow);
        }
        
        .settings-select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        
        .settings-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, var(--purple-main), var(--purple-soft));
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        
        .settings-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--purple-glow);
        }
        
        .settings-btn:active {
            transform: translateY(0);
        }
        
        .settings-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* List Items */
        .items-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            border: 1px solid rgba(124, 58, 237, 0.15);
            transition: all 0.3s ease;
        }
        
        .list-item:hover {
            border-color: var(--purple-main);
            background: rgba(124, 58, 237, 0.05);
            transform: translateX(4px);
        }
        
        .item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .item-icon {
            font-size: 1.2rem;
        }
        
        .item-details {
            flex: 1;
        }
        
        .item-name {
            font-weight: 600;
            color: white;
            margin-bottom: 4px;
        }
        
        .item-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .delete-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.85rem;
        }
        
        .delete-btn:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.05);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        
        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        
        /* Badge */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(124, 58, 237, 0.2);
            color: var(--purple-soft);
            margin-left: 8px;
        }
        
        /* Toast for settings page */
        .settings-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            padding: 12px 20px;
            border-radius: 10px;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            color: white;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        .settings-toast.error {
            background: linear-gradient(135deg, #f87171, #ef4444);
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        /* Scrollbar Styling */
        .items-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .items-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        
        .items-list::-webkit-scrollbar-thumb {
            background: var(--purple-main);
            border-radius: 10px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            .input-group {
                flex-direction: column;
            }
            
            .settings-wrapper {
                padding: 20px;
            }
        }
        
        /* Back to Dashboard Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ef4444;
            text-decoration: none;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            color: var(--purple-soft);
            transform: translateX(-4px);
        }
    </style>
</head>
<body class="dashboard-light">
    <div class="settings-wrapper">
        <div class="settings-container">
            
            <!-- Logout -->
            <a href="/admin/logout" class="back-link">Logout</a>
            
            <!-- Header -->
            <div class="settings-header">
                <h1>⚙️ Admin Settings</h1>
                <p>Manage allowed countries and promotional coupons</p>
            </div>
            
            <div class="settings-grid">
                
                <!-- COUNTRIES CARD -->
                <div class="settings-card">
                    <div class="card-header">
                        <h3>🌍 Allowed Countries</h3>
                        <p>Users from these countries can access the platform</p>
                    </div>
                    <div class="card-body">
                        <div class="input-group">
                            <input 
                                type="text" 
                                id="countryInput" 
                                class="settings-input" 
                                placeholder="Enter country code (e.g., US, GB, AU)"
                                maxlength="2"
                                style="text-transform: uppercase;"
                            >
                            <button onclick="addCountry()" class="settings-btn">
                                + Add Country
                            </button>
                        </div>
                        
                        <div id="countryList" class="items-list">
                            <!-- Countries will be loaded here -->
                            <div class="empty-state">
                                <div class="empty-state-icon">🌍</div>
                                <div>No countries added yet</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- COUPONS CARD -->
                <div class="settings-card">
                    <div class="card-header">
                        <h3>🎟️ Promotional Coupons</h3>
                        <p>Create discounts for your customers</p>
                    </div>
                    <div class="card-body">
                        <div class="input-group" style="flex-wrap: wrap;">
                            <input 
                                type="text" 
                                id="couponCode" 
                                class="settings-input" 
                                placeholder="Coupon code (e.g., SUMMER20)"
                                style="flex: 1; min-width: 120px;"
                            >
                            <input 
                                type="number" 
                                id="couponValue" 
                                class="settings-input" 
                                placeholder="Value"
                                style="flex: 1; min-width: 100px;"
                            >
                            <select id="couponType" class="settings-select" style="flex: 0.5;">
                                <option value="percentage">% Percentage</option>
                                <option value="fixed">$ Fixed</option>
                            </select>
                            <button onclick="addCoupon()" class="settings-btn">
                                + Add Coupon
                            </button>
                        </div>
                        
                        <div id="couponList" class="items-list">
                            <!-- Coupons will be loaded here -->
                            <div class="empty-state">
                                <div class="empty-state-icon">🎟️</div>
                                <div>No coupons created yet</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Show toast notification
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `settings-toast ${isError ? 'error' : ''}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Load all settings
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                
                // Load countries
                const countryList = document.getElementById('countryList');
                if (data.allowedCountries && data.allowedCountries.length > 0) {
                    countryList.innerHTML = '';
                    data.allowedCountries.forEach(country => {
                        const countryItem = createCountryItem(country);
                        countryList.appendChild(countryItem);
                    });
                } else {
                    countryList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🌍</div>
                            <div>No countries added yet</div>
                            <div style="font-size: 0.8rem; margin-top: 8px;">Add US to start</div>
                        </div>
                    `;
                }
                
                // Load coupons
                const couponList = document.getElementById('couponList');
                if (data.coupons && data.coupons.length > 0) {
                    couponList.innerHTML = '';
                    data.coupons.forEach(coupon => {
                        const couponItem = createCouponItem(coupon);
                        couponList.appendChild(couponItem);
                    });
                } else {
                    couponList.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🎟️</div>
                            <div>No coupons created yet</div>
                            <div style="font-size: 0.8rem; margin-top: 8px;">Create your first coupon above</div>
                        </div>
                    `;
                }
                
            } catch (err) {
                console.error('Failed to load settings:', err);
                showToast('Failed to load settings', true);
            }
        }
        
        // Create country list item with delete button
        function createCountryItem(country) {
            const div = document.createElement('div');
            div.className = 'list-item';
            div.innerHTML = `
                <div class="item-content">
                    <div class="item-icon">🌍</div>
                    <div class="item-details">
                        <div class="item-name">${country}</div>
                        <div class="item-meta">Country Code</div>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteCountry('${country}')">
                    Remove
                </button>
            `;
            return div;
        }
        
        // Create coupon list item with delete button
        function createCouponItem(coupon) {
            const div = document.createElement('div');
            div.className = 'list-item';
            
            const discountText = coupon.type === 'percentage' 
                ? `${coupon.value}% OFF` 
                : `$${coupon.value} OFF`;
            
            div.innerHTML = `
                <div class="item-content">
                    <div class="item-icon">🎟️</div>
                    <div class="item-details">
                        <div class="item-name">
                            ${coupon.code.toUpperCase()}
                            <span class="badge">${coupon.active ? 'Active' : 'Inactive'}</span>
                        </div>
                        <div class="item-meta">${discountText}</div>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteCoupon('${coupon.code}')">
                    Delete
                </button>
            `;
            return div;
        }
        
        // Add new country
        async function addCountry() {
            const input = document.getElementById('countryInput');
            let countryCode = input.value.trim().toUpperCase();
            
            if (!countryCode) {
                showToast('Please enter a country code', true);
                return;
            }
            
            if (countryCode.length !== 2) {
                showToast('Country code must be 2 letters (e.g., US, GB)', true);
                return;
            }
            
            try {
                // Get current settings
                const currentRes = await fetch('/api/settings');
                const current = await currentRes.json();
                
                // Check for duplicate
                if (current.allowedCountries.includes(countryCode)) {
                    showToast(`${countryCode} is already in the list`, true);
                    return;
                }
                
                // Add new country
                const updatedCountries = [...current.allowedCountries, countryCode];
                
                const res = await fetch('/api/settings/countries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ countries: updatedCountries })
                });
                
                if (res.ok) {
                    showToast(`✅ ${countryCode} added successfully`);
                    input.value = '';
                    loadSettings(); // Reload the list
                } else {
                    throw new Error('Failed to add country');
                }
                
            } catch (err) {
                console.error('Error adding country:', err);
                showToast('Failed to add country', true);
            }
        }
        
        // Delete country
        async function deleteCountry(countryCode) {
            try {
                const currentRes = await fetch('/api/settings');
                const current = await currentRes.json();
                
                const updatedCountries = current.allowedCountries.filter(c => c !== countryCode);
                
                const res = await fetch('/api/settings/countries', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ countries: updatedCountries })
                });
                
                if (res.ok) {
                    showToast(`🗑️ ${countryCode} removed successfully`);
                    loadSettings(); // Reload the list
                } else {
                    throw new Error('Failed to delete country');
                }
                
            } catch (err) {
                console.error('Error deleting country:', err);
                showToast('Failed to delete country', true);
            }
        }
        
        // Add new coupon
        async function addCoupon() {
            const code = document.getElementById('couponCode').value.trim().toUpperCase();
            const value = document.getElementById('couponValue').value;
            const type = document.getElementById('couponType').value;
            
            if (!code) {
                showToast('Please enter a coupon code', true);
                return;
            }
            
            if (!value || value <= 0) {
                showToast('Please enter a valid discount value', true);
                return;
            }
            
            if (type === 'percentage' && value > 100) {
                showToast('Percentage discount cannot exceed 100%', true);
                return;
            }
            
            try {
                const res = await fetch('/api/settings/coupons', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code, value: parseFloat(value), type })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    showToast(`✅ Coupon ${code} added successfully`);
                    // Clear inputs
                    document.getElementById('couponCode').value = '';
                    document.getElementById('couponValue').value = '';
                    loadSettings(); // Reload the list
                } else {
                    showToast(data.error || 'Failed to add coupon', true);
                }
                
            } catch (err) {
                console.error('Error adding coupon:', err);
                showToast('Failed to add coupon', true);
            }
        }
        
        // Delete coupon
        async function deleteCoupon(code) {
            try {
                const res = await fetch(`/api/settings/coupons/${code}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    showToast(`🗑️ Coupon ${code} deleted successfully`);
                    loadSettings(); // Reload the list
                } else {
                    throw new Error('Failed to delete coupon');
                }
                
            } catch (err) {
                console.error('Error deleting coupon:', err);
                showToast('Failed to delete coupon', true);
            }
        }
        
        // Auto-uppercase country input
        document.getElementById('countryInput').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase();
        });
        
        // Load settings on page load
        loadSettings();
    </script>
</body>
</html>
